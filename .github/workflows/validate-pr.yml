name: PR Checks

on:
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check Commit Message Format
        run: |
          echo "=== Workflow version: v4-pull_request ==="
          # ... rest of the script

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
      - name: Check Python Syntax (UC-0A)
        run: python -m py_compile uc-0a/classifier.py
      - name: Check Python Syntax (UC-0B, UC-0C, UC-X)
        run: |
          python -m py_compile uc-0b/app.py
          python -m py_compile uc-0c/app.py
          python -m py_compile uc-x/app.py
