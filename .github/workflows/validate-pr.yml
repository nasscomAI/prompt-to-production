name: PR Checks

on:
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  commit-lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check Commit Message Format
        shell: bash
        run: |
          for commit in $(git rev-list --no-merges "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"); do
            msg=$(git log -1 --pretty=format:%s "$commit")
            echo "Checking commit: $msg"

            if [[ ! "$msg" =~ ^\[?UC-[0-9A-Za-z]+\]?[[:space:]].{10,}$ ]]; then
              echo "Error: Commit message '$msg' does not follow the required format!"
              exit 1
            fi
          done

  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Check Python syntax for existing classifiers
        shell: bash
        run: |
          for file in uc-0a/classifier.py uc-0b/classifier.py uc-0c/classifier.py uc-x/classifier.py; do
            if [ -f "$file" ]; then
              echo "Checking $file"
              python -m py_compile "$file"
            else
              echo "Skipping $file (not present yet)"
            fi
          done
