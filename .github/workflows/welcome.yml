name: Welcome Participant

on:
  pull_request_target:
    types: [opened,synchronize,reopened]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  pull-requests: write
  issues: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    steps:
      - name: Welcome Message
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "👋 Hi there, participant! Thanks for joining our **Vibe Coding Session**! \n\nWe're reviewing your PR for the 4 User Cases. You don't need to get your PR merged — just make sure your **PR checks pass** (commit-lint and smoke-test) and your submission will be reviewed! 🏆 \n\n**Next Steps:**\n- Make sure all 4 UCs are finished.\n- Ensure your commit messages match the required format.\n- Fix any failing checks until both are green.\n- Good luck!"
            })
